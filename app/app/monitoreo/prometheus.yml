# Prometheus local: mismos jobs que monitoring/monitoring/prometheus.yml (EC2), con nombres de servicio Docker.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kafka-brokers
    static_configs:
      - targets: ["kafka-1:9404", "kafka-2:9404"]

  - job_name: zookeeper
    static_configs:
      - targets: ["zookeeper:9405"]

  # El productor solo existe mientras corre "docker compose run producer": fuera de eso aparece DOWN.
  - job_name: ventas-app
    static_configs:
      - targets: ["producer:9406", "consumer:9407"]
